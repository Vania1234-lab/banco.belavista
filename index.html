<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banco Bela Vista - Aluno</title><style>
:root{--roxo:#b91c1c;--verde:#16a34a;--azul:#0284c7;--laranja:#ea580c;--vermelho:#dc2626;--bg:#fff5f5}*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);font-family:Segoe UI,Arial;color:#1f2937}.box{max-width:460px;margin:30px auto;background:#fff;border-radius:24px;padding:24px;box-shadow:0 10px 30px #00000012}input,select,button{width:100%;padding:13px;border-radius:12px;margin:7px 0}input,select{border:1px solid #ddd;background:#fff}button{border:0;color:#fff;background:var(--roxo);font-weight:700;cursor:pointer}.verde{background:var(--verde)}.azul{background:var(--azul)}.laranja{background:var(--laranja)}.vermelho{background:var(--vermelho)}.cinza{background:#64748b}.saldo{font-size:34px;font-weight:800}.card{background:#fafafa;border:1px solid #eee;border-radius:16px;padding:16px;margin:14px 0}.muted{color:#667085;font-size:13px}#nome{font-size:22px;font-weight:800;color:#991b1b;margin:8px 0 18px;line-height:1.3}.erro{display:none;background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px}.sec{display:none}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}#area{display:none}.linha{display:flex;gap:8px}.linha button{flex:1}
</style></head><body>
<div class="box" id="login"><h2>🏦 Banco Bela Vista</h2><p class="muted">Entre com sua conta, dígito e senha.</p><input id="conta" placeholder="Conta"><input id="digito" placeholder="Dígito"><input id="senha" type="password" placeholder="Senha"><button onclick="entrarAluno()">Entrar</button><div id="statusLogin" class="muted">Preparando acesso...</div><div id="erro" class="erro"></div></div>
<div class="box" id="area"><h2>🏦 Banco Bela Vista</h2><div id="nome" class="muted"></div><div class="card"><div class="muted">Saldo disponível</div><div class="saldo" id="saldo">E$ 0,00</div></div><div class="card"><div class="muted">Poupança</div><h2 id="poupanca">E$ 0,00</h2><div id="rendimento" class="muted"></div></div>
<button class="laranja" onclick="toggle('pix');carregarDestinatarios()">💸 PIX</button><div id="pix" class="sec card"><select id="dest"></select><input id="pixValor" type="number" step="0.01" min="0.01" placeholder="Valor"><button class="laranja" onclick="enviarPix()">Enviar PIX</button></div>
<button class="verde" onclick="toggle('poup')">💰 Poupança</button><div id="poup" class="sec card"><input id="valorPoup" type="number" step="0.01" min="0.01" placeholder="Valor para guardar"><button class="verde" onclick="depositarPoupanca()">Depositar</button><button class="vermelho" onclick="sacarPoupanca()">Sacar tudo + rendimento</button></div>
<button class="azul" onclick="toggle('extrato');carregarExtrato()">📄 Extrato</button><div id="extrato" class="sec card"><input id="filtroData" type="date" onchange="carregarExtrato()"><div style="overflow:auto"><table><thead><tr><th>Data</th><th>Mov.</th><th>Valor</th></tr></thead><tbody id="tbExtrato"></tbody></table></div></div><button class="cinza" onclick="sairAluno()">Sair</button></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";import{getFirestore,collection,getDocs,doc,getDoc,onSnapshot,serverTimestamp,runTransaction}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";import{getAuth,signInAnonymously,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyDvvHGaBweUhNubXw-touq-8Ah0aEAiq7I",authDomain:"moacyrbank.firebaseapp.com",projectId:"moacyrbank",storageBucket:"moacyrbank.firebasestorage.app",messagingSenderId:"686843725224",appId:"1:686843725224:web:adb65c89ee4a470c43099d"};const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app);let idAtual='',aluno=null,cache={},unsub=null,taxaPct=5;const M=v=>`E$ ${Number(v||0).toFixed(2).replace('.',',')}`;const N=v=>Number(v||0)||0;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function garantir(){if(!auth.currentUser)await signInAnonymously(auth);const el=document.getElementById('statusLogin');if(el)el.style.display='none'}garantir().catch(e=>{console.error(e);const er=document.getElementById('erro');if(er){er.textContent='Não foi possível preparar o acesso. Verifique a conexão e o login anônimo no Firebase.';er.style.display='block'}});onAuthStateChanged(auth,u=>{if(u){const el=document.getElementById('statusLogin');if(el)el.style.display='none'}});
async function taxa(){const s=await getDoc(doc(db,'config','banco_eletiva'));taxaPct=s.exists()?Number(s.data().taxaMensalPct??5):5}
window.entrarAluno=async()=>{const er=document.getElementById('erro');if(er)er.style.display='none';try{await garantir();const c=document.getElementById('conta').value.trim(),dg=document.getElementById('digito').value.trim(),pw=document.getElementById('senha').value.trim();if(!c||!dg||!pw){if(er){er.textContent='Preencha conta, dígito e senha.';er.style.display='block'}return}const id=`${c}-${dg}`;const s=await getDoc(doc(db,'usuarios',id));if(!s.exists()||s.data().sistema!=='BANCO_ELETIVA'||String(s.data().senha||'')!==pw){if(er){er.textContent='Conta, dígito ou senha incorretos.';er.style.display='block'}return}if(String(s.data().status||'Ativo')!=='Ativo'){if(er){er.textContent='Conta inativa.';er.style.display='block'}return}idAtual=id;aluno={id,...s.data()};document.getElementById('login').style.display='none';document.getElementById('area').style.display='block';await taxa();const us=await getDocs(collection(db,'usuarios'));cache={};us.forEach(d=>{if(d.data().sistema==='BANCO_ELETIVA')cache[d.id]=d.data().nome||d.id});escutar();atualizar()}catch(e){console.error(e);if(er){er.textContent=e.code==='permission-denied'?'Acesso negado pelo Firestore. Verifique se as regras foram publicadas.':'Não foi possível entrar. '+(e.message||'');er.style.display='block'}}};
function escutar(){if(unsub)unsub();unsub=onSnapshot(doc(db,'usuarios',idAtual),s=>{if(s.exists()){aluno={id:idAtual,...s.data()};atualizar()}})}
function atualizar(){nome.textContent=`${aluno.nome||'Aluno'} • Conta ${idAtual}${aluno.turma?' • '+aluno.turma:''}`;saldo.textContent=M(aluno.saldo);const inicio=aluno.dataInicioPoupanca?.toDate?aluno.dataInicioPoupanca.toDate():null;const meses=inicio?Math.max((Date.now()-inicio.getTime())/(1000*60*60*24*30),0):0;const rend=N(aluno.poupanca)*(taxaPct/100)*meses;poupanca.textContent=M(aluno.poupanca);rendimento.textContent=`Rendimento estimado: ${M(rend)} • taxa ${taxaPct.toFixed(2).replace('.',',')}% a.m.`}
window.toggle=id=>{const e=document.getElementById(id);e.style.display=e.style.display==='block'?'none':'block'};window.carregarDestinatarios=()=>{dest.innerHTML='<option value="">Selecione o destinatário</option>';Object.entries(cache).sort((a,b)=>a[1].localeCompare(b[1])).forEach(([id,n])=>{if(id!==idAtual)dest.innerHTML+=`<option value="${id}">${esc(n)} (${id})</option>`})};
window.enviarPix=async()=>{const d=dest.value,v=N(pixValor.value);if(!d||v<=0)return alert('Informe destinatário e valor.');try{await runTransaction(db,async t=>{const rr=doc(db,'usuarios',idAtual),dr=doc(db,'usuarios',d),rs=await t.get(rr),ds=await t.get(dr);if(!rs.exists()||!ds.exists())throw new Error('Conta não encontrada.');const r=rs.data(),dd=ds.data();if(N(r.saldo)<v)throw new Error('Saldo insuficiente.');t.update(rr,{saldo:N(r.saldo)-v});t.update(dr,{saldo:N(dd.saldo)+v});t.set(doc(collection(db,'transacoes')),{origem:idAtual,nomeOrigem:r.nome||idAtual,destino:d,nomeDestino:dd.nome||d,valor:v,tipo:'pix',obs:'PIX',sistema:'BANCO_ELETIVA',data:serverTimestamp()})});pixValor.value='';dest.value='';alert('PIX enviado!');carregarExtrato()}catch(e){alert(e.message||'Não foi possível enviar o PIX.')}};
window.depositarPoupanca=async()=>{const v=N(valorPoup.value);if(v<=0)return alert('Valor inválido.');try{await runTransaction(db,async t=>{const r=doc(db,'usuarios',idAtual),s=await t.get(r),u=s.data();if(N(u.saldo)<v)throw new Error('Saldo insuficiente.');t.update(r,{saldo:N(u.saldo)-v,poupanca:N(u.poupanca)+v,dataInicioPoupanca:u.dataInicioPoupanca||serverTimestamp()});t.set(doc(collection(db,'transacoes')),{origem:idAtual,nomeOrigem:u.nome||idAtual,destino:'POUPANCA',nomeDestino:'Poupança',valor:v,tipo:'deposito_poupanca',obs:'Depósito na poupança',sistema:'BANCO_ELETIVA',data:serverTimestamp()})});valorPoup.value='';carregarExtrato()}catch(e){alert(e.message||'Erro no depósito.')}};
window.sacarPoupanca=async()=>{try{await taxa();await runTransaction(db,async t=>{const r=doc(db,'usuarios',idAtual),s=await t.get(r),u=s.data(),base=N(u.poupanca);if(base<=0)throw new Error('Não há valor na poupança.');const ini=u.dataInicioPoupanca?.toDate?u.dataInicioPoupanca.toDate():new Date(),meses=Math.max((Date.now()-ini.getTime())/(1000*60*60*24*30),0),rend=base*(taxaPct/100)*meses,total=base+rend;t.update(r,{saldo:N(u.saldo)+total,poupanca:0,dataInicioPoupanca:null});t.set(doc(collection(db,'transacoes')),{origem:'POUPANCA',nomeOrigem:'Poupança',destino:idAtual,nomeDestino:u.nome||idAtual,valor:total,tipo:'saque_poupanca',obs:`Saque da poupança (principal ${M(base)} + rendimento ${M(rend)})`,sistema:'BANCO_ELETIVA',data:serverTimestamp()})});alert('Poupança sacada com rendimento.');carregarExtrato()}catch(e){alert(e.message||'Erro no saque.')}};
window.carregarExtrato=async()=>{if(!idAtual)return;const s=await getDocs(collection(db,'transacoes')),f=filtroData.value,arr=[];s.forEach(d=>{const t=d.data();if(t.sistema!=='BANCO_ELETIVA'||(t.origem!==idAtual&&t.destino!==idAtual))return;const dt=t.data?.toDate?t.data.toDate():null;if(f&&dt&&dt.toISOString().slice(0,10)!==f)return;arr.push({...t,dt})});arr.sort((a,b)=>(b.dt?.getTime()||0)-(a.dt?.getTime()||0));tbExtrato.innerHTML='';arr.forEach(t=>{const deb=t.origem===idAtual;let desc=t.obs||t.tipo;if(t.tipo==='pix')desc=deb?`PIX para ${t.nomeDestino}`:`PIX de ${t.nomeOrigem}`;tbExtrato.innerHTML+=`<tr><td>${t.dt?t.dt.toLocaleString('pt-BR'):'-'}</td><td>${esc(desc)}</td><td style="color:${deb?'#dc2626':'#16a34a'}">${deb?'-':'+'} ${M(t.valor)}</td></tr>`});if(!arr.length)tbExtrato.innerHTML='<tr><td colspan="3">Nenhuma movimentação.</td></tr>'};
window.sairAluno=async()=>{if(unsub)unsub();try{await signOut(auth)}catch{}location.reload()};
</script></body></html>
